spring.application.name=booking_tour
# ===== Active Profile =====
# Đổi thành "prod" khi deploy lên production
spring.profiles.active=dev

# ===== Common Settings =====
server.address=0.0.0.0

# ===== Error Handling =====
# Không show stack trace trong response
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false

# ===== Logging =====
# Format log ra console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== JWT =====
# Secret key đọc từ environment variable JWT_SECRET
# Fallback cho dev local (không dùng ở production)
jwt.secret=${JWT_SECRET:booking-tour-super-secret-key-2026}
# Token hết hạn sau 24 giờ (ms)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
