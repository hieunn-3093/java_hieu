<!--
  Fragment: pagination
  Parameters:
    - baseUrl     : URL gốc để build link phân trang, VD: '/admin/tours'
    - currentPage : trang hiện tại (0-based)
    - totalPages  : tổng số trang
    - totalElements : tổng số bản ghi
    - pageSize    : số bản ghi mỗi trang
-->
<div th:fragment="pagination(baseUrl, currentPage, totalPages, totalElements, pageSize)">
  <div class="card-footer bg-white border-top d-flex align-items-center justify-content-between py-3 px-4"
       th:if="${totalPages > 0}" style="border-radius: 0 0 12px 12px;">

    <!-- Thông tin số bản ghi -->
    <small class="text-muted">
      Hiển thị
      <strong th:text="${currentPage * pageSize + 1}">1</strong>
      –
      <strong th:text="${(currentPage * pageSize + pageSize) > totalElements ? totalElements : (currentPage * pageSize + pageSize)}">10</strong>
      trong tổng số
      <strong th:text="${totalElements}">0</strong> bản ghi
    </small>

    <!-- Điều hướng trang -->
    <nav th:if="${totalPages > 1}">
      <ul class="pagination pagination-sm mb-0">

        <!-- Trang đầu -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="${baseUrl + '?page=0&size=' + pageSize}" aria-label="First">
            <i class="bi bi-chevron-double-left"></i>
          </a>
        </li>

        <!-- Trang trước -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="${baseUrl + '?page=' + (currentPage - 1) + '&size=' + pageSize}" aria-label="Previous">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>

        <!-- Số trang (hiển thị tối đa 5 trang xung quanh trang hiện tại) -->
        <th:block th:with="
            startPage=${currentPage - 2 < 0 ? 0 : currentPage - 2},
            endPage=${currentPage + 2 >= totalPages ? totalPages - 1 : currentPage + 2}">

          <!-- Dấu ... đầu nếu cần -->
          <li class="page-item disabled" th:if="${startPage > 0}">
            <span class="page-link">…</span>
          </li>

          <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <li class="page-item" th:classappend="${i == currentPage} ? 'active'">
              <a class="page-link" th:href="${baseUrl + '?page=' + i + '&size=' + pageSize}" th:text="${i + 1}">1</a>
            </li>
          </th:block>

          <!-- Dấu ... cuối nếu cần -->
          <li class="page-item disabled" th:if="${endPage < totalPages - 1}">
            <span class="page-link">…</span>
          </li>
        </th:block>

        <!-- Trang tiếp -->
        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
          <a class="page-link" th:href="${baseUrl + '?page=' + (currentPage + 1) + '&size=' + pageSize}" aria-label="Next">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>

        <!-- Trang cuối -->
        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
          <a class="page-link" th:href="${baseUrl + '?page=' + (totalPages - 1) + '&size=' + pageSize}" aria-label="Last">
            <i class="bi bi-chevron-double-right"></i>
          </a>
        </li>

      </ul>
    </nav>
  </div>
</div>
