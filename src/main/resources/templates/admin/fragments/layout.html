<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  =====================================================================
  FRAGMENT: adminHead
  Dùng: th:replace="~{admin/fragments/layout :: adminHead}"
  Title đặt trực tiếp trong mỗi trang, không truyền qua parameter
  =====================================================================
-->
<th:block th:fragment="adminHead">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --sidebar-width: 240px;
      --sidebar-bg: #1a1a2e;
      --sidebar-active: #e94560;
      --topbar-height: 60px;
    }
    body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }

    /* ===== SIDEBAR ===== */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-width); height: 100vh;
      background: var(--sidebar-bg); z-index: 1040;
      display: flex; flex-direction: column; transition: transform .3s ease;
    }
    .sidebar-brand {
      padding: 1.25rem 1.5rem; color: #fff; font-size: 1.2rem; font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex; align-items: center; gap: .75rem;
    }
    .sidebar-brand .brand-icon { font-size: 1.6rem; color: var(--sidebar-active); }
    .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
    .sidebar-nav .nav-section {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      color: rgba(255,255,255,.4); letter-spacing: 1px; padding: .75rem 1.5rem .25rem;
    }
    .sidebar-nav .nav-link {
      display: flex; align-items: center; gap: .75rem;
      color: rgba(255,255,255,.75); padding: .65rem 1.5rem;
      border-radius: 0; font-size: .9rem; transition: all .2s;
    }
    .sidebar-nav .nav-link i { font-size: 1.1rem; }
    .sidebar-nav .nav-link:hover,
    .sidebar-nav .nav-link.active {
      color: #fff; background: rgba(233,69,96,.2);
      border-left: 3px solid var(--sidebar-active);
    }
    .sidebar-footer { padding: 1rem 1.5rem; border-top: 1px solid rgba(255,255,255,.1); }

    /* ===== MAIN ===== */
    #main-content { margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
    #topbar {
      height: var(--topbar-height); background: #fff; border-bottom: 1px solid #e0e0e0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; position: sticky; top: 0; z-index: 1030;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .topbar-title { font-size: 1.1rem; font-weight: 600; color: #333; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .user-badge {
      background: #f0f2f5; border-radius: 50px; padding: .35rem .85rem;
      font-size: .85rem; font-weight: 600; color: #333;
      display: flex; align-items: center; gap: .5rem;
    }
    .user-badge .avatar {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #e94560, #c0392b);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .8rem; font-weight: 700;
    }
    .page-content { padding: 1.5rem; flex: 1; }
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.show { transform: translateX(0); }
      #main-content { margin-left: 0; }
    }
  </style>
</th:block>

<!--
  =====================================================================
  FRAGMENT: sidebar
  Dùng: th:replace="~{admin/fragments/layout :: sidebar('categories')}"
  activeMenu: tên menu đang active, ví dụ 'dashboard', 'categories', 'tours'...
  =====================================================================
-->
<nav id="sidebar" th:fragment="sidebar(activeMenu)">
  <div class="sidebar-brand">
    <i class="bi bi-airplane-engines-fill brand-icon"></i>
    <span>Booking Tour</span>
  </div>

  <div class="sidebar-nav">
    <div class="nav-section">Tổng quan</div>
    <a href="/admin/dashboard"
       th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-grid-fill"></i> Dashboard
    </a>

    <div class="nav-section">Quản lý</div>
    <a href="/admin/tours"
       th:classappend="${activeMenu == 'tours'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-map-fill"></i> Tours
    </a>
    <a href="#"
       th:classappend="${activeMenu == 'bookings'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-calendar-check-fill"></i> Đặt tour
    </a>
    <a href="#"
       th:classappend="${activeMenu == 'users'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-people-fill"></i> Người dùng
    </a>
    <a href="/admin/categories"
       th:classappend="${activeMenu == 'categories'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-tags-fill"></i> Danh mục
    </a>
    <a href="#"
       th:classappend="${activeMenu == 'reviews'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-chat-left-text-fill"></i> Đánh giá
    </a>

    <div class="nav-section">Hệ thống</div>
    <a href="#"
       th:classappend="${activeMenu == 'settings'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-gear-fill"></i> Cài đặt
    </a>
  </div>

  <div class="sidebar-footer">
    <form th:action="@{/admin/logout}" method="post" class="d-grid">
      <button type="submit" class="btn btn-outline-danger btn-sm">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </div>
</nav>

<!--
  =====================================================================
  FRAGMENT: topbar
  Dùng: th:replace="~{admin/fragments/layout :: topbar('Tên trang', 'bi-icon-name')}"
  =====================================================================
-->
<th:block th:fragment="topbar(pageTitle, pageIcon)">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-sm btn-light d-md-none" id="sidebarToggle">
        <i class="bi bi-list fs-5"></i>
      </button>
      <span class="topbar-title">
        <i th:class="${'bi ' + pageIcon + ' me-2 text-danger'}"></i>
        <span th:text="${pageTitle}">Trang quản trị</span>
      </span>
    </div>
    <div class="topbar-right">
      <div class="user-badge">
        <div class="avatar" th:text="${#strings.substring(username, 0, 1).toUpperCase()}">A</div>
        <span th:text="${username}">admin</span>
        <span class="badge bg-danger ms-1">Admin</span>
      </div>
    </div>
  </div>
</th:block>

<!--
  =====================================================================
  FRAGMENT: scripts
  Dùng: th:replace="~{admin/fragments/layout :: scripts}"
  =====================================================================
-->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('sidebarToggle')?.addEventListener('click', function () {
      document.getElementById('sidebar').classList.toggle('show');
    });
  </script>
</th:block>

</html>
