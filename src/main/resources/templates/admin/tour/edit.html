<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{admin/fragments/layout :: adminHead}"></th:block>
  <title>Sửa tour | Booking Tour Admin</title>
</head>
<body>

<!-- SIDEBAR -->
<th:block th:replace="~{admin/fragments/layout :: sidebar('tours')}"></th:block>

<!-- MAIN CONTENT -->
<div id="main-content">

  <!-- TOPBAR -->
  <th:block th:replace="~{admin/fragments/layout :: topbar('Sửa tour', 'bi-pencil-fill')}"></th:block>

  <!-- PAGE CONTENT -->
  <div class="page-content">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin/dashboard" class="text-decoration-none">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="/admin/tours" class="text-decoration-none">Tour</a></li>
        <li class="breadcrumb-item active">Sửa tour</li>
      </ol>
    </nav>

    <!-- Flash messages -->
    <th:block th:replace="~{admin/fragments/flash_message :: flashMessages}"></th:block>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
          <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
            <h5 class="fw-bold mb-0">
              <i class="bi bi-pencil-fill me-2 text-danger"></i>Sửa tour
            </h5>
            <p class="text-muted small mt-1 mb-0">Chỉnh sửa thông tin tour và nhấn Lưu.</p>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/admin/tours/{id}/edit(id=${tour.id})}" method="post" th:object="${tour}">

              <div class="row g-3">

                <!-- Tên tour -->
                <div class="col-12">
                  <label for="title" class="form-label fw-semibold">
                    Tên tour <span class="text-danger">*</span>
                  </label>
                  <input type="text" id="title" th:field="*{title}"
                         th:class="${#fields.hasErrors('title')} ? 'form-control is-invalid' : 'form-control'"
                         placeholder="Ví dụ: Tour Đà Lạt 3 ngày 2 đêm"
                         required maxlength="255" />
                  <div class="invalid-feedback" th:errors="*{title}">Tên tour không được để trống</div>
                </div>

                <!-- Mô tả -->
                <div class="col-12">
                  <label for="description" class="form-label fw-semibold">Mô tả</label>
                  <textarea id="description" th:field="*{description}"
                            class="form-control" rows="3"
                            placeholder="Mô tả ngắn về tour..."></textarea>
                </div>

                <!-- Danh mục + Địa điểm -->
                <div class="col-md-6">
                  <label for="category" class="form-label fw-semibold">
                    Danh mục <span class="text-danger">*</span>
                  </label>
                  <select id="category" name="category.id"
                          th:class="${#fields.hasErrors('category')} ? 'form-select is-invalid' : 'form-select'"
                          required>
                    <option value="">-- Chọn danh mục --</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${tour.category != null and tour.category.id != null and tour.category.id == cat.id}">
                      Danh mục
                    </option>
                  </select>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                  <div class="invalid-feedback" th:if="${!#fields.hasErrors('category')}">Danh mục không được để trống</div>
                </div>

                <div class="col-md-6">
                  <label for="location" class="form-label fw-semibold">Địa điểm</label>
                  <input type="text" id="location" th:field="*{location}"
                         class="form-control" placeholder="Ví dụ: Đà Lạt, Lâm Đồng"
                         maxlength="255" />
                </div>

                <!-- Giá + Thời gian -->
                <div class="col-md-6">
                  <label for="price" class="form-label fw-semibold">
                    Giá (₫) <span class="text-danger">*</span>
                  </label>
                  <input type="number" id="price" th:field="*{price}"
                         th:class="${#fields.hasErrors('price')} ? 'form-control is-invalid' : 'form-control'"
                         placeholder="Ví dụ: 2500000"
                         required min="0" step="1000" />
                  <div class="invalid-feedback" th:errors="*{price}">Giá không hợp lệ</div>
                </div>

                <div class="col-md-6">
                  <label for="duration" class="form-label fw-semibold">Thời gian</label>
                  <input type="text" id="duration" th:field="*{duration}"
                         class="form-control" placeholder="Ví dụ: 3 ngày 2 đêm"
                         maxlength="100" />
                </div>

                <!-- Ngày bắt đầu + Số lượng slot -->
                <div class="col-md-6">
                  <label for="startDate" class="form-label fw-semibold">Ngày bắt đầu <span class="text-danger">*</span></label>
                  <input type="date" id="startDate" name="startDate"
                         th:value="${tour.startDate != null ? #temporals.format(tour.startDate, 'yyyy-MM-dd') : ''}"
                         th:class="${#fields.hasErrors('startDate')} ? 'form-control is-invalid' : 'form-control'"
                         required />
                  <div class="invalid-feedback" th:errors="*{startDate}">Ngày bắt đầu không hợp lệ</div>
                </div>

                <div class="col-md-6">
                  <label for="maxSlots" class="form-label fw-semibold">Số lượng slot <span class="text-danger">*</span></label>
                  <input type="number" id="maxSlots" th:field="*{maxSlots}"
                         th:class="${#fields.hasErrors('maxSlots')} ? 'form-control is-invalid' : 'form-control'"
                         placeholder="Ví dụ: 20"
                         required min="1" max="9999" />
                  <div class="invalid-feedback" th:errors="*{maxSlots}">Số lượng slot phải lớn hơn 0</div>
                </div>

                <!-- Trạng thái -->
                <div class="col-md-6">
                  <label for="status" class="form-label fw-semibold">Trạng thái</label>
                  <select id="status" th:field="*{status}" class="form-select">
                    <option value="AVAILABLE" th:selected="${tour.status?.name() == 'AVAILABLE'}">AVAILABLE</option>
                    <option value="FULL"      th:selected="${tour.status?.name() == 'FULL'}">FULL</option>
                    <option value="CANCELLED" th:selected="${tour.status?.name() == 'CANCELLED'}">CANCELLED</option>
                  </select>
                </div>

              </div><!-- /row -->

              <!-- Buttons -->
              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-danger px-4">
                  <i class="bi bi-save me-1"></i> Lưu thay đổi
                </button>
                <a href="/admin/tours" class="btn btn-outline-secondary px-4">
                  <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /page-content -->
</div><!-- /main-content -->

<!-- SCRIPTS -->
<th:block th:replace="~{admin/fragments/layout :: scripts}"></th:block>
</body>
</html>
