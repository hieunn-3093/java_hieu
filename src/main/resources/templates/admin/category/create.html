<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{admin/fragments/layout :: adminHead}"></th:block>
  <title>Thêm danh mục | Booking Tour Admin</title>
</head>
<body>

<!-- SIDEBAR (fragment dùng chung) -->
<th:block th:replace="~{admin/fragments/layout :: sidebar('categories')}"></th:block>

<!-- MAIN CONTENT -->
<div id="main-content">

  <!-- TOPBAR (fragment dùng chung) -->
  <th:block th:replace="~{admin/fragments/layout :: topbar('Thêm danh mục mới', 'bi-plus-circle-fill')}"></th:block>

  <!-- PAGE CONTENT -->
  <div class="page-content">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin/dashboard" class="text-decoration-none">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="/admin/categories" class="text-decoration-none">Danh mục</a></li>
        <li class="breadcrumb-item active">Thêm mới</li>
      </ol>
    </nav>

    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
          <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
            <h5 class="fw-bold mb-0">
              <i class="bi bi-tag-fill me-2 text-danger"></i>Thêm danh mục mới
            </h5>
            <p class="text-muted small mt-1 mb-0">Điền thông tin danh mục và nhấn Lưu.</p>
          </div>
          <div class="card-body p-4">

            <!-- Form tạo mới -->
            <form th:action="@{/admin/categories/create}" method="post"
                  th:object="${category}">

              <!-- Tên danh mục -->
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold">
                  Tên danh mục <span class="text-danger">*</span>
                </label>
                <input type="text" id="name" name="name"
                       th:field="*{name}"
                       class="form-control"
                       placeholder="Ví dụ: Tour trong nước"
                       required />
              </div>

              <!-- Mô tả -->
              <div class="mb-4">
                <label for="description" class="form-label fw-semibold">Mô tả</label>
                <textarea id="description" name="description"
                          th:field="*{description}"
                          class="form-control" rows="4"
                          placeholder="Mô tả ngắn về danh mục..."></textarea>
              </div>

              <!-- Buttons -->
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger px-4">
                  <i class="bi bi-save me-1"></i> Lưu danh mục
                </button>
                <a href="/admin/categories" class="btn btn-outline-secondary px-4">
                  <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /page-content -->
</div><!-- /main-content -->

<!-- SCRIPTS (fragment dùng chung) -->
<th:block th:replace="~{admin/fragments/layout :: scripts}"></th:block>
</body>
</html>
