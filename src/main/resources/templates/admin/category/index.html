<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{admin/fragments/layout :: adminHead}"></th:block>
  <title>Danh mục | Booking Tour Admin</title>
</head>
<body>

<!-- SIDEBAR (fragment dùng chung) -->
<th:block th:replace="~{admin/fragments/layout :: sidebar('categories')}"></th:block>

<!-- MAIN CONTENT -->
<div id="main-content">

  <!-- TOPBAR (fragment dùng chung) -->
  <th:block th:replace="~{admin/fragments/layout :: topbar('Quản lý Danh mục', 'bi-tags-fill')}"></th:block>

  <!-- PAGE CONTENT -->
  <div class="page-content">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin/dashboard" class="text-decoration-none">Dashboard</a></li>
        <li class="breadcrumb-item active">Danh mục</li>
      </ol>
    </nav>

    <!-- Flash messages -->
    <th:block th:replace="~{admin/fragments/flash_message :: flashMessages}"></th:block>

    <!-- Header row -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h5 class="fw-bold mb-0">
        <i class="bi bi-tags-fill me-2 text-danger"></i>Danh sách danh mục
      </h5>
      <a href="/admin/categories/create" class="btn btn-danger btn-sm">
        <i class="bi bi-plus-circle me-1"></i> Thêm danh mục
      </a>
    </div>

    <!-- Table -->
    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 60px;">#</th>
                <th>Tên danh mục</th>
                <th>Mô tả</th>
                <th>Số tour</th>
                <th style="width: 160px;" class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <!-- Lặp qua danh sách category -->
              <tr th:each="category, stat : ${categories}">
                <td th:text="${stat.index + 1}">1</td>
                <td>
                  <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1 me-1">
                    <i class="bi bi-tag-fill me-1"></i>
                  </span>
                  <strong th:text="${category.name}">Tên danh mục</strong>
                </td>
                <td>
                  <span class="text-muted" th:text="${category.description != null ? category.description : '—'}">Mô tả</span>
                </td>
                <td>
                  <span class="badge bg-secondary"
                        th:text="${category.tourCount} + ' tours'">
                    0 tours
                  </span>
                </td>
                <td class="text-center">
                  <!-- Nút Sửa -->
                  <a th:href="@{/admin/categories/{id}/edit(id=${category.id})}"
                     class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                    <i class="bi bi-pencil-fill"></i>
                  </a>
                  <!-- Nút Xoá -->
                  <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
                        method="post" class="d-inline"
                        onsubmit="return confirm('Bạn chắc chắn muốn xoá danh mục này?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xoá">
                      <i class="bi bi-trash-fill"></i>
                    </button>
                  </form>
                </td>
              </tr>

              <!-- Không có dữ liệu -->
              <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="5" class="text-center text-muted py-4">
                  <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                  Chưa có danh mục nào.
                  <a href="/admin/categories/create" class="text-danger ms-1">Tạo ngay</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /page-content -->
</div><!-- /main-content -->

<!-- SCRIPTS (fragment dùng chung) -->
<th:block th:replace="~{admin/fragments/layout :: scripts}"></th:block>
</body>
</html>
