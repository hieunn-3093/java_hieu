<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Đăng nhập | Booking Tour</title>
  <!-- Bootstrap 5 CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .login-header {
      background: linear-gradient(135deg, #e94560, #c0392b);
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
      color: #fff;
    }
    .login-header i {
      font-size: 2.5rem;
      margin-bottom: .5rem;
    }
    .login-body {
      padding: 2rem;
    }
    .btn-login {
      background: linear-gradient(135deg, #e94560, #c0392b);
      border: none;
      color: #fff;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #c0392b, #a93226);
      color: #fff;
    }
    .form-control:focus {
      border-color: #e94560;
      box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, 0.25);
    }
  </style>
</head>
<body>
  <div class="login-card card">
    <!-- Header -->
    <div class="login-header">
      <div><i class="bi bi-shield-lock-fill"></i></div>
      <h4 class="mb-0 fw-bold">Trang quản trị</h4>
      <small class="opacity-75">Booking Tour Admin Panel</small>
    </div>

    <!-- Body -->
    <div class="login-body">

      <!-- Alert lỗi -->
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Alert đăng xuất thành công -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <form th:action="@{/admin/login}" method="post">
        <!-- CSRF token tự động được Thymeleaf + Spring Security inject -->

        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">
            <i class="bi bi-person-fill me-1"></i>Tên đăng nhập
          </label>
          <input
            type="text"
            class="form-control form-control-lg"
            id="username"
            name="username"
            placeholder="Nhập tên đăng nhập"
            autocomplete="username"
            required
            autofocus />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">
            <i class="bi bi-lock-fill me-1"></i>Mật khẩu
          </label>
          <div class="input-group">
            <input
              type="password"
              class="form-control form-control-lg"
              id="password"
              name="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                    title="Hiện / ẩn mật khẩu">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-login btn-lg">
            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle hiện / ẩn mật khẩu
    document.getElementById('togglePassword').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('toggleIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });
  </script>
</body>
</html>
